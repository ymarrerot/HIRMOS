name: Documentation issue
description: Report confusing, missing, outdated, or incorrect public documentation.
title: "docs: "
labels: ["type: docs"]
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Link or path to the page/file.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or direction
    validations:
      required: false
